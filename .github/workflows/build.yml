name: Windows client

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.296.0
          cache: true

      - name: Configure
        shell: bash
        run: |
          mkdir release
          cd release
          cmake -A x64 -DEXCEPTION_HANDLING=ON -DVULKAN=ON -DDISCORD=ON -DTOOLS=OFF -DAUTOUPDATE=ON -DDOWNLOAD_GTEST=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=. ..

      - name: Build
        shell: bash
        run: |
          cd release
          cmake --build . --config Release --target everything

      - name: Package
        shell: bash
        run: |
          cd release
          cmake --build . --config Release --target package_default
          mkdir artifacts
          mv *-win64.zip artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: BestClient-Windows
          path: release/artifacts
